<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FinAtt</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem calc(1.5rem + env(safe-area-inset-left)) 2rem calc(1.5rem + env(safe-area-inset-right));
        background: #0b1220;
        color: #e2e8f0;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 1.5rem;
        display: grid; place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        font-weight: 700; font-size: 22px; color: #fff; letter-spacing: -0.5px;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 600; }
      p { margin: 0 auto; max-width: 32ch; color: #94a3b8; }
      code {
        display: inline-block; margin-top: 1.5rem; padding: 0.5rem 0.75rem;
        border: 1px solid #1e293b; border-radius: 8px; background: #0f172a;
        color: #7dd3fc; font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">FA</div>
      <h1>No app URL configured</h1>
      <p>
        This shell renders the deployed FinAtt website. Set the origin it should
        load, then re-sync the native projects.
      </p>
      <code>mobile/.env → FINATT_APP_URL</code>
    </main>
  </body>
</html>
